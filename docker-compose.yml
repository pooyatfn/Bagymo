services:
  postgres:
    image: postgres:16
    container_name: bagymo-postgres
    environment:
      POSTGRES_DB: bagymo
      POSTGRES_USER: bagymo
      POSTGRES_PASSWORD: bagymo123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagymo -d bagymo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bagymo-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bagymo-backend
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bagymo-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./web/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
