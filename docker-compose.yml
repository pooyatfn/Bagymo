version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: bagymo-postgres
    environment:
      POSTGRES_DB: bagymo
      POSTGRES_USER: bagymo
      POSTGRES_PASSWORD: bagymo123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagymo -d bagymo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bagymo-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
