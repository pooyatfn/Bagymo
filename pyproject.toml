[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "web", "*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "api", "billing", "bookings", "budgets", "catalog", "companies", "config", "core"]
